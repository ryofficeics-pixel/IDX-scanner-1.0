<style>
:root{
  --canvas:#000000;
  --surface:#15181e;
  --surface-2:#1f232b;
  --surface-3:#3b3d45;
  --hairline:#3b3d45;
  --hairline-soft:#252830;
  --ink:#ffffff;
  --body:#b2b6bd;
  --muted:#656a76;
  --accent:#7b42bc;
  --accent-bright:#911ced;
  --accent-blue:#2b89ff;
  --success:#00ca8e;
  --warning:#ffcf25;
  --error:#e62b1e;
  --waypoint:#14c6cb;
  --vagrant:#1868f2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;min-height:100%;overflow-x:hidden;}
body{background:var(--canvas);color:var(--ink);font-family:'Inter',-apple-system,system-ui,sans-serif;min-height:100vh;}
::-webkit-scrollbar{width:0;height:0;}
input,button{font-family:'Inter',-apple-system,system-ui,sans-serif;}
button{border:none;cursor:pointer;background:none;}
.mono{font-family:'DM Mono',monospace;}
.page{display:none;width:100%;padding:64px 16px 96px;max-width:430px;margin:0 auto;min-height:100vh;}
.page.active{display:block;}
#topbar{position:fixed;top:0;left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:430px;z-index:999;background:rgba(0,0,0,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(178,182,189,.16);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;}
#navbar{position:fixed;bottom:0;left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:430px;z-index:999;background:rgba(0,0,0,.97);backdrop-filter:blur(18px);border-top:1px solid rgba(178,182,189,.16);display:flex;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;color:var(--body);font-size:9px;font-weight:700;letter-spacing:0;text-transform:uppercase;position:relative;transition:color 160ms;}
.nav-btn.active{color:var(--ink);}
.nav-btn.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;height:2px;background:var(--accent);border-radius:0 0 2px 2px;box-shadow:none;}
.nav-icon{font-size:17px;line-height:1;}
.card{background:var(--surface);border:1px solid rgba(178,182,189,.14);border-radius:12px;backdrop-filter:none;}
.card-cyan{background:linear-gradient(180deg,var(--surface-2),var(--surface));border-color:rgba(123,66,188,.50);box-shadow:none;}
.card-green{background:linear-gradient(180deg,rgba(0,202,142,.20),var(--surface));border-color:rgba(0,202,142,.45);}
.card-pink{background:linear-gradient(180deg,rgba(230,43,30,.20),var(--surface));border-color:rgba(230,43,30,.45);}
.card-blue{background:linear-gradient(180deg,var(--surface-2),var(--surface));border-color:rgba(43,137,255,.35);}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;font-weight:700;letter-spacing:0;white-space:nowrap;}
.bdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.score-track{background:rgba(255,255,255,.08);border-radius:0;overflow:hidden;}
.score-fill{height:100%;border-radius:0;transition:width .7s cubic-bezier(.4,0,.2,1);}
.act-buy{background:rgba(0,255,156,.14);border:1.5px solid rgba(0,255,156,.5);color:#00FF9C;box-shadow:0 0 8px rgba(0,255,156,.28);}
.act-sell{background:rgba(230,43,30,.14);border:1.5px solid rgba(230,43,30,.5);color:#e62b1e;}
.act-hold{background:rgba(255,207,37,.12);border:1.5px solid rgba(255,207,37,.45);color:#ffcf25;}
.hscroll{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;max-width:100%;padding-bottom:4px;scrollbar-width:none;scroll-snap-type:x proximity;}
.hscroll>*{scroll-snap-align:start;}
.hscroll::-webkit-scrollbar{display:none;}
.tab-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.tab-btn{border-radius:8px!important;padding:7px 12px;font-size:10px;font-weight:700;letter-spacing:0;text-transform:uppercase;transition:all 180ms;white-space:nowrap;flex-shrink:0;cursor:pointer;}
#ambient{position:fixed;inset:0;pointer-events:none;z-index:0;}
#ambient::before{content:'';position:absolute;left:0;right:0;top:0;height:190px;background:radial-gradient(circle at 80% 0%,rgba(123,66,188,.26),transparent 42%),linear-gradient(180deg,rgba(31,35,43,.72),rgba(0,0,0,0));}
#ambient::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 0 60%,rgba(20,198,203,.055) 60% 61%,transparent 61% 100%);}
#app{position:relative;z-index:1;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
@keyframes spin{to{transform:rotate(360deg);}}
@supports (padding: max(0px)) {
  .page{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(96px,calc(88px + env(safe-area-inset-bottom)));}
  #topbar{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));}
  #navbar{padding-bottom:env(safe-area-inset-bottom);}
}
.fade-in{animation:fadeIn 180ms ease-out;}
.price-track{height:6px;background:rgba(255,255,255,.08);border-radius:0;position:relative;overflow:visible;}
.price-fill{height:100%;border-radius:0;}
.price-dot{position:absolute;top:-1px;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:none;transform:translateX(-50%);}
.data-table{width:100%;border-collapse:collapse;font-size:11px;}
.data-table th{padding:6px 8px;color:rgba(255,255,255,.38);font-weight:700;font-size:9px;letter-spacing:.06em;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap;}
.data-table td{padding:8px;border-bottom:1px solid rgba(255,255,255,.04);}
.data-table tr{cursor:pointer;}
.search-wrap{position:relative;margin-bottom:10px;}
.search-input{width:100%;background:var(--surface);border:1px solid rgba(178,182,189,.16);border-radius:8px;padding:10px 12px 10px 36px;color:#fff;font-size:13px;outline:none;}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.38);font-size:13px;pointer-events:none;}
.toggle{width:44px;height:25px;border-radius:999px;position:relative;cursor:pointer;transition:all 200ms;flex-shrink:0;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);}
.toggle.on{border-color:var(--accent);background:rgba(123,66,188,.35);}
.toggle-knob{position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.3);transition:left 200ms ease;}
.toggle.on .toggle-knob{left:20px;background:var(--accent);box-shadow:none;}
.zone-bar{position:relative;height:12px;border-radius:99px;overflow:visible;background:linear-gradient(90deg,rgba(230,43,30,.45) 0%,rgba(255,207,37,.42) 48%,rgba(0,202,142,.42) 100%);}
.zone-ptr{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;border:2px solid #000;box-shadow:0 0 12px currentColor;transition:left .7s ease;}
.levels-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.level-cell{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:11px 12px;}
#topbar [style*="linear-gradient(135deg,#7b42bc,#2b89ff)"]{background:var(--accent)!important;border-radius:8px!important;box-shadow:none!important;}
#topbar button{text-transform:none;letter-spacing:0!important;}
#syncPill{background:var(--surface)!important;border-color:rgba(178,182,189,.16)!important;border-radius:8px!important;}
#topbar button[onclick*="upload"]{background:#fff!important;border-color:#fff!important;color:#000!important;border-radius:8px!important;}
button[style*="border-radius:999px"],
button[style*="border-radius:14px"],
button[style*="border-radius:12px"],

div[style*="border-radius:20px"][style*="cursor:pointer"],

<script>
'use strict';

// ----
// SAFE MATH HELPERS  no NaN, no Infinity
// ----
function num(v, fb) {
  fb = arguments.length < 2 ? 0 : fb;
  var n = Number(v);
  return Number.isFinite(n) ? n : fb;
}
function maybeNum(v) {
  var n = Number(v);
  return Number.isFinite(n) ? n : null;
}
function safeDiv(a, b, fb) {
  fb = arguments.length < 3 ? 0 : fb;
  a = Number(a); b = Number(b);
  if (!Number.isFinite(a) || !Number.isFinite(b) || b === 0) return fb;
  return a / b;
}
function validPrice(v) {
  var n = Number(v);
  return Number.isFinite(n) && n > 0;
}
function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, num(v, lo)));
}
function escAttr(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}
function hasFlowData(s) {
  return ['brokerBuy','brokerSell','foreignBuy','foreignSell','netBuy','freqBuy','freqSell']
    .some(function(k){ return Number.isFinite(Number(s[k])); });
}
function dataMode(s) {
  var flow = ['brokerBuy','brokerSell','foreignBuy','foreignSell','netBuy','freqBuy','freqSell'];
  var has  = flow.filter(function(k){ return Number.isFinite(Number(s[k])); });
  if (!s || !validPrice(s.price)) return 'NO_DATA';
  if (s.dataMode === 'LOCAL_SAMPLE') return 'LOCAL_SAMPLE';
  if (s.dataMode === 'FLOW_STALE') return 'FLOW_STALE';
  if (s.flowTradeDate && s.flowTradeDate !== todayWIB()) return 'FLOW_STALE';
  if (has.length === flow.length) return 'FULL_FLOW';
  if (has.length > 0)             return 'PARTIAL_FLOW';
  return 'PRICE_ONLY';
}

function todayWIB() {
  return new Date().toLocaleDateString('en-CA', { timeZone:'Asia/Jakarta' });
}

// ----
// COLOR / FORMAT HELPERS
// ----
var C = {
  cyan:'#7b42bc', green:'#00ca8e', pink:'#e62b1e',
  yellow:'#ffcf25', orange:'#bb5a00', purple:'#14c6cb',
  accent:'#2b89ff', text:'#FFFFFF',
  sec:'#b2b6bd', ter:'#656a76'
};
function fmtB(n) {
  if (!Number.isFinite(n)) return 'N/A';
  var a=Math.abs(n), sg=n<0?'-':'';
  if(a>=1e12)return sg+(a/1e12).toFixed(2)+'T';
  if(a>=1e9) return sg+(a/1e9).toFixed(2)+'B';
  if(a>=1e6) return sg+(a/1e6).toFixed(1)+'M';
  if(a>=1e3) return sg+(a/1e3).toFixed(1)+'K';
  return n.toFixed(0);
}
function fmtK(n) {
  if (!Number.isFinite(n)) return 'N/A';
  return n >= 1000 ? (n/1000).toFixed(1)+'K' : String(Math.round(n));
}
function fmtPrice(n) {
  if (!Number.isFinite(Number(n))) return 'N/A';
  return Number(n).toLocaleString('id-ID');
}
function fmtTime(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function fmtDateTime(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleString('id-ID',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function pctColor(v) { return num(v) >= 0 ? C.green : C.pink; }
function pctStr(v, dec) {
  dec = dec || 2;
  var n = num(v);
  return (n >= 0 ? '+' : '') + n.toFixed(dec) + '%';
}

// ----
// LOCAL CACHE (localStorage)
// ----
var LS_KEY = 'idx_flow_cache_v2';
var PREF_KEY = 'idx_flow_preferences_v2';
function safeJsonParse(raw, fallback) {
  try { return JSON.parse(raw); } catch(e) { return fallback; }
}
function cacheEnvelope(payload) {
  var diagnostics = payload && payload.diagnostics ? payload.diagnostics : {};
  return {
    payload:payload,
    savedAt:Date.now(),
    marketDate:payload && payload.marketDate ? payload.marketDate : todayWIB(),
    provider:(diagnostics.provider || (payload && payload.market && payload.market.source) || STATE.provider || '-'),
    diagnostics:diagnostics
  };
}
function saveToLocalCache(payload) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(cacheEnvelope(payload))); } catch(e){}
}
function loadFromLocalCache() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    var obj = safeJsonParse(raw, null);
    return obj && obj.payload ? obj : null;
  } catch(e) { return null; }
}
function clearLocalCache() {
  try { localStorage.removeItem(LS_KEY); } catch(e){}
}
function savePrefs() {
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify({
      watchlist: STATE.watchlist,
      syncInterval: STATE.syncInterval,
      uploadedFlow: STATE.uploadedFlow
    }));
  } catch(e) {}
}
function loadPrefs() {
  try {
    var raw = localStorage.getItem(PREF_KEY);
    if (!raw) return;
    var p = safeJsonParse(raw, null);
    if (!p) return;
    if (Array.isArray(p.watchlist)) STATE.watchlist = p.watchlist.filter(function(s){ return SYMBOLS.includes(s); });
    if (Number(p.syncInterval) >= 15) STATE.syncInterval = Number(p.syncInterval);
    if (p.uploadedFlow && typeof p.uploadedFlow === 'object') STATE.uploadedFlow = p.uploadedFlow;
  } catch(e) {}
}

// ----
// PAYLOAD VALIDATION & APPLICATION
// ----
function validatePayload(p) {
  if (!p || typeof p !== 'object') throw new Error('Invalid payload: not an object');
  if (p.ok && p.recommendations) return;
  if (!p.quotes || typeof p.quotes !== 'object') throw new Error('Invalid payload: missing quotes');
  if (Object.keys(p.quotes).length === 0) throw new Error('Payload has 0 quotes');
}

function flattenScanRecommendations(scan) {
  var out = {}, recs = scan && scan.recommendations ? scan.recommendations : {};
  Object.keys(recs).forEach(function(key){
    (recs[key] || []).forEach(function(sig){
      if (!sig || !sig.symbol) return;
      if (!out[sig.symbol] || num(sig.score) > num(out[sig.symbol].score)) out[sig.symbol] = sig;
    });
  });
  return Object.keys(out).map(function(k){ return out[k]; });
}

function quoteFromSignal(sig) {
  return {
    symbol:sig.symbol,
    price:sig.lastPrice,
    prevClose:sig.previousClose,
    high:sig.indicators && sig.indicators.dayHigh ? sig.indicators.dayHigh : sig.lastPrice,
    low:sig.indicators && sig.indicators.dayLow ? sig.indicators.dayLow : sig.lastPrice,
    volume:sig.volume,
    pctChg:sig.changePct,
    volumeAvg5d:sig.avgVolume20,
    asOf:sig.timestamp,
    source:sig.source || 'scan',
    dataMode:sig.action === 'NO_DATA' ? 'NO_DATA' : 'PRICE_ONLY',
    backendSignal:sig
  };
}
function isMarketHours(status) {
  return ['MORNING','LUNCH_BREAK','AFTERNOON','PRE_CLOSE'].includes(status);
}
function updateFreshnessState(payload, sourceMode, cacheMeta) {
  var lastUpdated = payload && (payload.lastUpdated || payload.generatedAt);
  var ageMs = lastUpdated ? Date.now() - new Date(lastUpdated).getTime() : null;
  STATE.dataAgeMinutes = Number.isFinite(ageMs) ? Math.max(0, ageMs / 60000) : null;
  STATE.marketDate = (cacheMeta && cacheMeta.marketDate) || (payload && payload.marketDate) || todayWIB();
  STATE.snapshotOnly = Boolean(sourceMode === 'cache' && STATE.marketDate && STATE.marketDate !== todayWIB());
  if (payload && payload.diagnostics && payload.diagnostics.dataFreshness === 'no-data') STATE.scanMode = 'no-data';
  else if (STATE.snapshotOnly) STATE.scanMode = 'snapshot';
  else if (STATE.dataAgeMinutes != null && STATE.dataAgeMinutes > 15 && isMarketHours(payload && payload.session && payload.session.status)) STATE.scanMode = 'stale';
  else if (sourceMode === 'cache') STATE.scanMode = 'cache';
  else STATE.scanMode = 'live';
}

function applyPayload(p) {
  if (!p) return;
  if (p.ok && p.recommendations) {
    updateFreshnessState(p, STATE.cacheStatus === 'localStorage' ? 'cache' : 'live');
    STATE.scanResult = p;
    STATE.freshness = p.diagnostics && p.diagnostics.cacheHit ? 'STALE_PRICE' : 'LIVE_PRICE';
    STATE.provider = (p.diagnostics && p.diagnostics.provider) || (p.market && p.market.source) || 'scan';
    STATE.dataSource = (p.market && p.market.source) || 'scan';
    STATE.lastAsOf = p.generatedAt || null;
    STATE.syncErrors = p.diagnostics && Array.isArray(p.diagnostics.errors) ? p.diagnostics.errors : [];
    STATE.syncWarnings = p.diagnostics && Array.isArray(p.diagnostics.warnings) ? p.diagnostics.warnings : [];
    if (p.market) {
      STATE.liveIHSG = {
        price:p.market.ihsgPrice,
        prevClose:null,
        chg:null,
        pctChg:p.market.ihsgChangePct,
        high:p.market.ihsgPrice,
        low:p.market.ihsgPrice,
        marketState:p.session ? p.session.status : 'UNKNOWN',
        asOf:p.market.timestamp,
        source:p.market.source
      };
    }
    flattenScanRecommendations(p).forEach(function(sig){
      if (!STOCK_META[sig.symbol]) {
        STOCK_META[sig.symbol] = {name:sig.name || sig.symbol, sector:'IDX'};
        SYMBOLS.push(sig.symbol);
      }
      var quote = quoteFromSignal(sig);
      if (STATE.snapshotOnly) quote.backendSignal = null;
      STATE.liveQuotes[sig.symbol] = quote;
    });
    addLog((p.summary ? p.summary.scanned : flattenScanRecommendations(p).length) + ' saham discan. Sumber: ' + STATE.provider);
    return;
  }
  var quotes = p.quotes || {};
  Object.keys(quotes).forEach(function(sym) {
    var q = quotes[sym];
    if (!q) return;
    if (!STOCK_META[sym]) {
      STOCK_META[sym] = {name:sym, sector:'IDX'};
      SYMBOLS.push(sym);
    }
    STATE.liveQuotes[sym] = q;
    // Append to sparkline
    if (validPrice(q.price) && SPARKS[sym]) {
      SPARKS[sym] = SPARKS[sym].slice(-19).concat([Math.round(num(q.price))]);
    }
  });
  if (p.IHSG && validPrice(p.IHSG.price)) {
    STATE.liveIHSG = p.IHSG;
  }
  STATE.freshness   = p.freshness  || 'STALE';
  STATE.provider    = p.provider   || p.source || '';
  STATE.dataSource  = p.source     || '';
  STATE.lastAsOf    = p.asOf       || null;
  STATE.syncErrors  = Array.isArray(p.errors)   ? p.errors   : [];
  STATE.syncWarnings= Array.isArray(p.warnings) ? p.warnings : [];
  // Log counts
  var count = Object.keys(STATE.liveQuotes).length;
  addLog(count + ' saham diperbarui. Sumber: ' + STATE.provider);
  if (STATE.syncWarnings.length) addLog('Peringatan: ' + STATE.syncWarnings[0]);
}

function getFreshnessAge(asOf) {
  if (!asOf) return null;
  var ms = Date.now() - new Date(asOf).getTime();
  if (ms < 90000)  return 'LIVE';
  if (ms < 900000) return 'RECENT';
  return 'STALE';
}

// ----
// SYNC ENGINE  calls /api/scan
// ----
function addLog(msg) {
  STATE.syncLog.push({ts:Date.now(), msg:String(msg)});
  if (STATE.syncLog.length > 30) STATE.syncLog.shift();
}

function searchUniverseMatches(query, limit) {
  var q = String(query || '').trim().toLowerCase();
  if (!q) return [];
  return SYMBOLS.filter(function(sym) {
    var meta = STOCK_META[sym] || {};
    return sym.toLowerCase().includes(q)
      || String(meta.name || '').toLowerCase().includes(q)
      || String(meta.sector || '').toLowerCase().includes(q);
  }).slice(0, limit || 40);
}

function symbolsForSync() {
  var set = new Set(DEFAULT_QUOTE_SYMBOLS.slice(0, 120));
  (STATE.watchlist || []).forEach(function(sym){ if (STOCK_META[sym]) set.add(sym); });
  if (STATE.scanSearch) {
    searchUniverseMatches(STATE.scanSearch, 40).forEach(function(sym){ set.add(sym); });
  }
  return Array.from(set).slice(0, 160);
}

function mergeScanPayload(base, next) {
  if (!base) return next;
  var merged = JSON.parse(JSON.stringify(base));
  var nextSummary = next.summary || {};
  var summary = merged.summary || {};
  summary.scanned = num(summary.scanned) + num(nextSummary.scanned);
  summary.valid = num(summary.valid) + num(nextSummary.valid);
  summary.noData = num(summary.noData) + num(nextSummary.noData);
  summary.errorCount = num(summary.errorCount) + num(nextSummary.errorCount);
  ['strongBuyCount','buyCount','holdCount','sellCount','topGainerCount','accumulationProxyCount','distributionProxyCount'].forEach(function(k){
    summary[k] = num(summary[k]) + num(nextSummary[k]);
  });
  merged.summary = summary;
  var buckets = ['strongBuy','beliPagi','beliSore','topBuy','topGainers','accumulationProxy','distributionProxy','risk','hold','sell'];
  buckets.forEach(function(bucket){
    var bySymbol = {};
    (merged.recommendations[bucket] || []).concat((next.recommendations && next.recommendations[bucket]) || []).forEach(function(sig){
      if (!sig || !sig.symbol) return;
      if (!bySymbol[sig.symbol] || num(sig.score) > num(bySymbol[sig.symbol].score)) bySymbol[sig.symbol] = sig;
    });
    merged.recommendations[bucket] = Object.keys(bySymbol).map(function(sym){ return bySymbol[sym]; })
      .sort(function(a,b){ return num(b.score)-num(a.score); })
      .slice(0, bucket === 'hold' || bucket === 'sell' ? 80 : 30);
  });
  merged.diagnostics = merged.diagnostics || {};
  var nextDiag = next.diagnostics || {};
  merged.diagnostics.failedSymbols = Array.from(new Set([].concat(merged.diagnostics.failedSymbols || [], nextDiag.failedSymbols || [])));
  merged.diagnostics.providerLatencyMs = num(merged.diagnostics.providerLatencyMs) + num(nextDiag.providerLatencyMs);
  merged.diagnostics.validRatio = merged.summary.scanned ? merged.summary.valid / merged.summary.scanned : 0;
  merged.diagnostics.noDataRatio = merged.summary.scanned ? merged.summary.noData / merged.summary.scanned : 0;
  merged.diagnostics.scanFinishedAt = nextDiag.scanFinishedAt || merged.diagnostics.scanFinishedAt;
  return merged;
}

function autoScanTargetCount() {
  var universeCount = SYMBOLS.length || (window.IDX_UNIVERSE_COUNT || 900);
  return universeCount;
}

async function fetchScanPayload(params) {
  var res = await fetch('/api/scan?' + params.toString(), {
    method: 'GET',
    headers: { 'Accept': 'application/json' },
    signal: AbortSignal.timeout(45000)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  var payload = await res.json();
  validatePayload(payload);
  return payload;
}

async function fetchLive(force) {
  if (STATE.fetching) return;
  STATE.fetching = true;
  STATE.scanProgress = null;
  setSyncUI('fetching');
  addLog('Mengambil data dari backend web sync');

  try {
    var payload = null;
    if (STATE.scanSearch) {
      var params = new URLSearchParams();
      params.set('symbols', symbolsForSync().join(','));
      params.set('limit', '120');
      payload = await fetchScanPayload(params);
    } else {
      var total = autoScanTargetCount();
      for (var offset=0; offset<total; offset+=FULL_SCAN_CHUNK_SIZE) {
        var chunkParams = new URLSearchParams();
        var chunkLimit = Math.min(FULL_SCAN_CHUNK_SIZE, total - offset);
        chunkParams.set('limit', String(chunkLimit));
        chunkParams.set('offset', String(offset));
        var chunk = await fetchScanPayload(chunkParams);
        payload = mergeScanPayload(payload, chunk);
        STATE.scanProgress = { done:Math.min(offset + chunkLimit, total), total:total };
        addLog('Scan universe '+STATE.scanProgress.done+' / '+total);
        renderCurrent();
      }
    }
    STATE.cacheStatus = 'fresh';
    STATE.scanProgress = null;
    applyPayload(payload);
    saveToLocalCache(payload);
    STATE.lastSync = Date.now();
    var dataFreshness = payload.diagnostics && payload.diagnostics.dataFreshness;
    var uiState = (payload.freshness === 'LIVE' || payload.freshness === 'LIVE_PRICE' || dataFreshness === 'live') ? 'live'
                : (payload.freshness === 'STALE' || payload.freshness === 'STALE_PRICE' || dataFreshness === 'stale') ? 'stale' : 'local';
    setSyncUI(uiState);
    addLog('Sync berhasil. Freshness: ' + payload.freshness);
    renderCurrent();
    focusScannerSearch();
  } catch(err) {
    STATE.scanProgress = null;
    var msg = err && err.message ? err.message : String(err);
    addLog('Sync gagal: ' + msg);
    // Try local cache
    var cached = loadFromLocalCache();
    if (cached && cached.payload) {
      addLog('Memakai cache lokal terakhir (STALE).');
      STATE.cacheStatus = 'localStorage';
      cached.payload.freshness = 'STALE';
      cached.payload.marketDate = cached.marketDate || cached.payload.marketDate;
      applyPayload(cached.payload);
      STATE.lastSync = cached.savedAt || null;
      setSyncUI('stale');
      renderCurrent();
      focusScannerSearch();
    } else {
      addLog('Tidak ada cache. Menampilkan state kosong; coba sync ulang.');
      STATE.freshness = 'NO_DATA';
      setSyncUI('error');
      renderCurrent();
      focusScannerSearch();
    }
  } finally {
    STATE.fetching = false;
  }
}

function forceSync() { fetchLive(true); }
function runAutoScan() { fetchLive(true); }

function startSyncTimer() {
  if (STATE.syncTimer) clearInterval(STATE.syncTimer);
  if (!STATE.syncInterval || STATE.syncInterval < 15) return;
  STATE.syncTimer = setInterval(fetchLive, STATE.syncInterval * 1000);
}

function setSyncUI(state) {
  STATE.syncState = state;
  var dot   = document.getElementById('syncDot');
  var label = document.getElementById('syncLabel');
  var pill  = document.getElementById('syncPill');
  var tEl   = document.getElementById('syncTime');
  if (!dot) return;
  var map = {
    idle:     {c:'rgba(255,255,255,.38)', l:'STANDBY', bc:'rgba(255,255,255,.2)'},
    fetching: {c:'#ffcf25', l:'FETCHING', bc:'rgba(255,207,37,.3)'},
    live:     {c:'#00FF9C', l:'LIVE',     bc:'rgba(0,255,156,.3)'},
    stale:    {c:'#FF8C42', l:'STALE',    bc:'rgba(255,140,66,.3)'},
    local:    {c:'#A78BFA', l:'LOCAL',    bc:'rgba(167,139,250,.3)'},
    error:    {c:'#e62b1e', l:'ERROR',    bc:'rgba(123,66,188,.3)'},
  };
  var cfg = map[state] || map.idle;
  dot.style.background = cfg.c;
  dot.style.animation  = state === 'fetching' ? 'blink .9s ease-in-out infinite' : 'none';
  dot.style.boxShadow  = state === 'live' ? '0 0 6px #00FF9C' : 'none';
  label.textContent    = cfg.l;
  label.style.color    = cfg.c;
  pill.style.borderColor = cfg.bc;
  if (tEl && STATE.lastSync) tEl.textContent = fmtTime(STATE.lastSync);
}

// ----
// SIGNAL ENGINE
// ----
function calcNetBuy(s) {
  var nb = maybeNum(s.netBuy);
  if (nb === null) return null;
  return clamp((safeDiv(nb, Math.abs(nb)+1e6) + 1) * 50, 0, 100);
}
function calcForeign(s) {
  var fb = maybeNum(s.foreignBuy), fs = maybeNum(s.foreignSell);
  if (fb === null || fs === null) return null;
  var total = fb + fs;
  return total > 0 ? clamp(safeDiv(fb, total)*100, 0, 100) : 50;
}
function calcBrkDist(s) {
  var bb = maybeNum(s.brokerBuy), bs = maybeNum(s.brokerSell);
  if (bb === null || bs === null || !validPrice(s.price)) return null;
  var avg = (bb+bs)/2;
  if (avg <= 0) return null;
  var d = safeDiv(s.price-avg, avg);
  if (d > .08) return 18;
  if (d < -.08) return 82;
  return clamp(50-d*500, 0, 100);
}
function calcFreq(s) {
  var fb = maybeNum(s.freqBuy), fs = maybeNum(s.freqSell);
  if (fb === null || fs === null) return null;
  var total = fb + fs;
  return total > 0 ? clamp(safeDiv(fb,total)*100, 0, 100) : 50;
}
function calcVolSpike(s) {
  var vol = maybeNum(s.volume), avg5 = maybeNum(s.volumeAvg5d);
  if (vol === null || avg5 === null || avg5 <= 0) return null;
  var r = safeDiv(vol, avg5);
  if (r > 5) return 95; if (r > 3) return 82; if (r > 2) return 68;
  if (r > 1.5) return 58; if (r < .5) return 20;
  return 50;
}
function calcRiskFlags(s) {
  var flags = [];
  var price = num(s.price), prev = num(s.prevClose);
  if (prev > 0 && price > 0) {
    var pChg = safeDiv(price-prev, prev);
    if (pChg > .20) flags.push({label:'Risiko ARA', color:C.pink});
  }
  var bb = maybeNum(s.brokerBuy), bs = maybeNum(s.brokerSell);
  if (bb !== null && bs !== null && price > 0) {
    var bAvg = (bb+bs)/2;
    if (bAvg > 0 && Math.abs(safeDiv(price-bAvg, bAvg)) > .10)
      flags.push({label:'Jauh Broker Avg', color:C.yellow});
  }
  var fb = maybeNum(s.foreignBuy), fs = maybeNum(s.foreignSell);
  if (fb !== null && fs !== null) {
    var fRatio = safeDiv(fs, fb+fs+1);
    if (fRatio > .65) flags.push({label:'Foreign Sell', color:C.yellow});
  }
  var vol = maybeNum(s.volume), avg5 = maybeNum(s.volumeAvg5d);
  if (vol !== null && avg5 !== null && avg5 > 0 && safeDiv(vol,avg5) > 4.5)
    flags.push({label:'Volume Spike Ekstrem', color:C.pink});
  var frqB = maybeNum(s.freqBuy), frqS = maybeNum(s.freqSell);
  if (frqB !== null && frqS !== null && safeDiv(frqB,frqB+frqS+1) < .35)
    flags.push({label:'Frequency Lemah', color:C.ter});
  var nb = maybeNum(s.netBuy);
  if (nb !== null && nb < 0 && fb !== null && fs !== null && safeDiv(fs,fb+fs+1) > .55)
    flags.push({label:'Distribusi Terselubung', color:C.pink});
  return flags;
}

function calcScore(s) {
  if (s.backendSignal && Number.isFinite(Number(s.backendSignal.score))) return Number(s.backendSignal.score);
  var mode = dataMode(s);
  if (mode === 'PRICE_ONLY' || mode === 'LOCAL_SAMPLE' || mode === 'NO_DATA' || mode === 'FLOW_STALE') return null;
  var components = 0, total = 0;
  var nb = calcNetBuy(s);
  if (nb !== null)  { total += nb*0.30;    components += 0.30; }
  var ff = calcForeign(s);
  if (ff !== null)  { total += ff*0.20;    components += 0.20; }
  var bd = calcBrkDist(s);
  if (bd !== null)  { total += bd*0.15;    components += 0.15; }
  var vs = calcVolSpike(s);
  if (vs !== null)  { total += vs*0.15;    components += 0.15; }
  var fq = calcFreq(s);
  if (fq !== null)  { total += fq*0.10;    components += 0.10; }
  if (components <= 0) {
    return null;
  }
  // Normalize to 0-100 based on available components
  var base  = clamp(safeDiv(total, components), 0, 100);
  var penalty = calcRiskFlags(s).length * 12 * 0.10;
  // Reduce confidence if data is incomplete
  var confidenceMult = (mode === 'PRICE_ONLY' || mode === 'LOCAL_SAMPLE') ? 0.65 : (mode === 'PARTIAL_FLOW' ? 0.82 : 1.0);
  return clamp((base - penalty) * confidenceMult, 0, 100);
}

function classifySig(score) {
  if (score === null || score === undefined || !Number.isFinite(Number(score))) {
    return {label:'FLOW N/A', short:'N/A', color:C.ter, bg:'rgba(255,255,255,.07)'};
  }
  score = num(score);
  if (score >= 85) return {label:'AKUMULASI KUAT',short:'AKU+',  color:C.green, bg:'rgba(0,255,156,.13)'};
  if (score >= 70) return {label:'AKUMULASI',     short:'AKU',   color:C.cyan,  bg:'rgba(123,66,188,.11)'};
  if (score >= 55) return {label:'WATCHLIST',     short:'WATCH', color:C.yellow,bg:'rgba(255,207,37,.11)'};
  if (score >= 40) return {label:'HOLD',          short:'HOLD',  color:'rgba(255,255,255,.55)',bg:'rgba(255,255,255,.07)'};
  if (score >= 20) return {label:'DISTRIBUSI',    short:'DIST',  color:C.orange,bg:'rgba(255,140,66,.11)'};
  return               {label:'HINDARI',          short:'HINDARI',color:C.pink, bg:'rgba(123,66,188,.11)'};
}

function calcTrading(s) {
  if (s.backendSignal) {
    var sig = s.backendSignal;
    var action = sig.action === 'STRONG_BUY' ? 'BUY'
      : sig.action === 'WATCH' ? 'HOLD'
      : sig.action === 'AVOID' || sig.action === 'NO_DATA' ? 'SELL'
      : sig.action;
    if (!['BUY','HOLD','SELL'].includes(action)) action = 'HOLD';
    var ac = action==='BUY'?C.green:action==='SELL'?C.pink:C.yellow;
    var ab = action==='BUY'?'rgba(0,255,156,.14)':action==='SELL'?'rgba(123,66,188,.14)':'rgba(255,207,37,.12)';
    var reasons = (sig.reasons || []).map(function(t){ return {t:t, p:true}; })
      .concat((sig.warnings || []).map(function(t){ return {t:t, p:false}; }));
    return {
      action:action, ac:ac, ab:ab, ag:ac, conf:Math.round(clamp(sig.confidence || 0,0,100)),
      slabel:(sig.confidence||0)>=80?'SANGAT KUAT':(sig.confidence||0)>=60?'KUAT':(sig.confidence||0)>=40?'SEDANG':'LEMAH',
      scolor:(sig.confidence||0)>=80?C.green:(sig.confidence||0)>=60?C.cyan:(sig.confidence||0)>=40?C.yellow:C.orange,
      eL:validPrice(s.price)?Math.round(s.price*.99/10)*10:null,
      eH:validPrice(s.price)?Math.round(s.price*1.01/10)*10:null,
      t1:validPrice(s.price)?Math.round(s.price*1.025/10)*10:null,
      t2:validPrice(s.price)?Math.round(s.price*1.05/10)*10:null,
      sl:validPrice(s.price)?Math.round(s.price*.96/10)*10:null,
      rr:'-',
      reasons:reasons
    };
  }
  var rawScore= calcScore(s);
  var score   = rawScore === null ? 0 : num(rawScore);
  var risk    = calcRiskFlags(s);
  var fP      = maybeNum(calcForeign(s));
  var frP     = maybeNum(calcFreq(s));
  var mode    = dataMode(s);
  var hasFull = (mode === 'FULL_FLOW');

  var action, ac, ab, ag;
  // BUY requires full/partial flow data  don't signal BUY on price-only
  if (rawScore === null) {
    action='HOLD'; ac=C.yellow; ab='rgba(255,207,37,.12)'; ag=C.yellow;
  } else if (hasFull && score >= 70 && risk.length <= 1 && num(fP,50) >= 50 && num(frP,50) >= 55) {
    action='BUY';  ac=C.green;  ab='rgba(0,255,156,.14)'; ag=C.green;
  } else if (score <= 35 || risk.length >= 3 || (mode!=='PRICE_ONLY' && num(fP,50) < 30 && num(s.netBuy,0) < 0)) {
    action='SELL'; ac=C.pink;   ab='rgba(123,66,188,.14)';ag=C.pink;
  } else {
    action='HOLD'; ac=C.yellow; ab='rgba(255,207,37,.12)'; ag=C.yellow;
  }

  // Confidence  reduced for price-only data
  var rawConf = action==='BUY'  ? clamp((score-70)/30*100,0,100)
              : action==='SELL' ? clamp((40-score)/40*100,0,100) : 50;
  var confMult = (mode==='PRICE_ONLY'||mode==='LOCAL_SAMPLE') ? 0.5 : (mode==='PARTIAL_FLOW' ? 0.75 : 1.0);
  var conf = Math.round(clamp(rawConf * confMult, 0, 100));

  // Levels  only calculate if price is valid
  var price = num(s.price);
  var bb    = num(s.brokerBuy,  price);
  var bs    = num(s.brokerSell, price);
  var bAvg  = (bb+bs)/2 || price;
  var rnd   = function(v){ return Math.round(num(v)/10)*10; };
  var up    = (score/100)*.08;
  var slP   = risk.length>=2 ? .03 : .05;
  var eL    = validPrice(price) ? rnd(Math.min(price,bAvg)*.995) : null;
  var eH    = validPrice(price) ? rnd(Math.max(price,bAvg)*1.005) : null;
  var t1    = validPrice(price) ? rnd(price*(1+up*.5)) : null;
  var t2    = validPrice(price) ? rnd(price*(1+up))    : null;
  var sl    = validPrice(price) ? rnd(Math.min(price*(1-slP), bs*.98)) : null;
  var rr    = (t2&&sl&&t2>price&&sl<price) ? safeDiv(t2-price,price-sl).toFixed(1) : '-';

  var slabel = conf>=80?'SANGAT KUAT':conf>=60?'KUAT':conf>=40?'SEDANG':'LEMAH';
  var scolor = conf>=80?C.green:conf>=60?C.cyan:conf>=40?C.yellow:C.orange;

  var reasons = [];
  var nb = maybeNum(s.netBuy);
  if (nb !== null && nb > 0) reasons.push({t:'Net buy '+fmtB(nb), p:true});
  if (nb !== null && nb < 0) reasons.push({t:'Net sell '+fmtB(nb), p:false});
  if (fP !== null && fP > 55) reasons.push({t:'Foreign buy '+fP.toFixed(0)+'%', p:true});
  if (fP !== null && fP < 45) reasons.push({t:'Foreign sell dominan', p:false});
  if (frP !== null && frP > 60) reasons.push({t:'Freq buy dominan '+frP.toFixed(0)+'%', p:true});
  var vs = calcVolSpike(s);
  if (vs !== null && vs > 65) reasons.push({t:'Volume spike aktif', p:true});
  if (mode === 'PRICE_ONLY')    reasons.push({t:'Data flow tidak tersedia  confidence terbatas', p:false});
  if (mode === 'LOCAL_SAMPLE')  reasons.push({t:'Data sample lokal  bukan harga real', p:false});
  risk.forEach(function(f){ reasons.push({t:f.label, p:false}); });

  return {action,ac,ab,ag,conf,slabel,scolor,eL,eH,t1,t2,sl,rr,reasons};
}

function enrich(sym, liveQ) {
  var flow = STATE.uploadedFlow[sym] || {};
  var meta = STOCK_META[sym] || {name:sym, sector:''};
  // Merge: live price overrides base; flow data from upload
  var s = {
    symbol:    sym,
    name:      meta.name,
    sector:    meta.sector,
    // Price fields from live (or null)
    price:     liveQ && validPrice(liveQ.price)     ? num(liveQ.price)     : null,
    prevClose: liveQ && validPrice(liveQ.prevClose) ? num(liveQ.prevClose) : null,
    high:      liveQ ? maybeNum(liveQ.high)   : null,
    low:       liveQ ? maybeNum(liveQ.low)    : null,
    volume:    liveQ ? maybeNum(liveQ.volume) : null,
    pctChg:    liveQ ? num(liveQ.pctChg)      : 0,
    // Flow fields  from upload only (not faked)
    brokerBuy:   liveQ && liveQ.brokerBuy   != null ? maybeNum(liveQ.brokerBuy)   : maybeNum(flow.brokerBuy),
    brokerSell:  liveQ && liveQ.brokerSell  != null ? maybeNum(liveQ.brokerSell)  : maybeNum(flow.brokerSell),
    foreignBuy:  liveQ && liveQ.foreignBuy  != null ? maybeNum(liveQ.foreignBuy)  : maybeNum(flow.foreignBuy),
    foreignSell: liveQ && liveQ.foreignSell != null ? maybeNum(liveQ.foreignSell) : maybeNum(flow.foreignSell),
    netBuy:      liveQ && liveQ.netBuy      != null ? maybeNum(liveQ.netBuy)      : maybeNum(flow.netBuy),
    freqBuy:     liveQ && liveQ.freqBuy     != null ? maybeNum(liveQ.freqBuy)     : maybeNum(flow.freqBuy),
    freqSell:    liveQ && liveQ.freqSell    != null ? maybeNum(liveQ.freqSell)    : maybeNum(flow.freqSell),
    volumeAvg5d: maybeNum(flow.volumeAvg5d),
    flowTradeDate: flow.tradeDate || null,
    flowSource: flow.source || (flow.tradeDate ? 'local-csv' : null),
    flowUpdatedAt: flow.updatedAt || null,
    // Source metadata
    dataMode: liveQ ? (liveQ.dataMode||'PRICE_ONLY') : 'NO_DATA',
    asOf:     liveQ ? (liveQ.asOf||null) : null,
    source:   liveQ ? (liveQ.source||'-') : 'base-data',
    backendSignal: liveQ ? liveQ.backendSignal : null,
  };
  // Override dataMode based on actual available fields
  s.dataMode = dataMode(s);

  var score     = calcScore(s);
  var signal    = s.backendSignal
    ? {label:s.backendSignal.category === 'ACCUMULATION_PROXY' ? 'AKUMULASI PROXY' : s.backendSignal.category === 'DISTRIBUTION_PROXY' ? 'DISTRIBUSI PROXY' : s.backendSignal.action, short:s.backendSignal.action === 'STRONG_BUY' ? 'SB' : s.backendSignal.action, color:s.backendSignal.action === 'STRONG_BUY' || s.backendSignal.action === 'BUY' ? C.green : s.backendSignal.action === 'SELL' || s.backendSignal.action === 'AVOID' || s.backendSignal.riskLevel === 'HIGH' ? C.pink : C.yellow, bg:'rgba(255,255,255,.08)'}
    : classifySig(score);
  var hasBrokerFlow = s.brokerBuy != null && s.brokerSell != null;
  var brokerAvg = hasBrokerFlow ? (num(s.brokerBuy)+num(s.brokerSell))/2 : null;
  return Object.assign(s, {
    score,
    signal,
    brokerAvg,
    hasBrokerFlow: hasBrokerFlow,
    pbDist:     validPrice(brokerAvg) ? safeDiv(num(s.price)-brokerAvg, brokerAvg)*100 : null,
    foreignNet: num(s.foreignBuy) - num(s.foreignSell),
    foreignPct: (function(){ var f=calcForeign(s); return f!==null?f-50:null; })(),
    riskFlags:  s.backendSignal && s.backendSignal.riskLevel === 'HIGH' ? [{label:'Risk tinggi', color:C.pink}].concat((s.backendSignal.warnings || []).slice(0,2).map(function(w){ return {label:w, color:C.orange}; })) : calcRiskFlags(s),
    volRatio:   (function(){ var a=maybeNum(s.volumeAvg5d); return a&&a>0?safeDiv(s.volume,a):null; })(),
    freqRatio:  (function(){ var b=maybeNum(s.freqBuy),c=maybeNum(s.freqSell); return b!==null&&c!==null?safeDiv(b,b+c)*100:null; })(),
    trading:    calcTrading(s),
  });
}

function getRenderableSymbols() {
  var set = new Set(DEFAULT_QUOTE_SYMBOLS.slice(0, 160));
  Object.keys(STATE.liveQuotes || {}).forEach(function(sym){ if (STOCK_META[sym]) set.add(sym); });
  (STATE.watchlist || []).forEach(function(sym){ if (STOCK_META[sym]) set.add(sym); });
  return Array.from(set);
}
function getEnriched(symbolList) {
  var list = Array.isArray(symbolList) ? symbolList : getRenderableSymbols();
  return list.map(function(sym){ return enrich(sym, STATE.liveQuotes[sym]||null); });
}

function sparkSVG(data, w, h, color, filled) {
  if (!data||data.length<2) return '-';
  var min=Math.min.apply(null,data),max=Math.max.apply(null,data),rng=max-min||1;
  var pts=data.map(function(v,i){return (i/(data.length-1))*w+','+(h-2-((v-min)/rng)*(h-6));}).join(' ');
  var id='sp'+w+h+(color||'-').replace(/\W/g,'');
  var poly=filled?'<polygon points="0,'+h+' '+pts+' '+w+','+h+'" fill="url(#'+id+')"/>':'';
  return '<svg width="'+w+'" height="'+h+'" style="display:block;overflow:visible"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".35"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+poly+'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function ringHTML(pct, color, size, stroke, label) {
  if (pct === null || pct === undefined || !Number.isFinite(Number(pct))) {
    size=size||52; stroke=stroke||6;
    var cx0=size/2, cy0=size/2, r0=size/2-stroke/2;
    return '<svg width="'+size+'" height="'+size+'"><circle cx="'+cx0+'" cy="'+cy0+'" r="'+r0+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="'+stroke+'"/><text x="'+cx0+'" y="'+(cy0+4)+'" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="10" font-weight="700" font-family="DM Mono,monospace">N/A</text>'+(label?'<text x="'+cx0+'" y="'+(cy0+14)+'" text-anchor="middle" fill="rgba(255,255,255,.38)" font-size="8" font-family="DM Sans,sans-serif">'+label+'</text>':'')+'</svg>';
  }
  pct=clamp(num(pct),0,100); size=size||52; stroke=stroke||6;
  var r=size/2-stroke/2, circ=2*Math.PI*r, off=circ*(1-pct/100);
  var cx=size/2, cy=size/2;
  return '<svg width="'+size+'" height="'+size+'"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="'+stroke+'"/><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'" stroke-linecap="round" transform="rotate(-90 '+cx+' '+cy+')" style="transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)"/><text x="'+cx+'" y="'+(cy+(label?2:4))+'" text-anchor="middle" fill="'+color+'" font-size="'+(label?10:12)+'" font-weight="700" font-family="DM Mono,monospace">'+Math.round(pct)+'</text>'+(label?'<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" fill="rgba(255,255,255,.38)" font-size="8" font-family="DM Sans,sans-serif">'+label+'</text>':'')+'</svg>';
}
function scoreBarHTML(score, height) {
  if (score === null || score === undefined || !Number.isFinite(Number(score))) {
    height=height||4;
    return '<div style="display:flex;align-items:center;gap:6px;"><div class="score-track" style="flex:1;height:'+height+'px;"><div class="score-fill" style="width:0%;background:rgba(255,255,255,.16);"></div></div><span class="mono" style="font-size:10px;color:'+C.ter+';min-width:28px;">N/A</span></div>';
  }
  height=height||4; score=clamp(num(score),0,100);

function isStrongBuyCandidate(s) {
  if (s.backendSignal) return s.backendSignal.action === 'STRONG_BUY';
  return s.dataMode === 'FULL_FLOW' && s.trading.action === 'BUY' && s.trading.conf >= 80 && scoreValue(s) >= 80 && s.riskFlags.length <= 1;
}
function sessionPlan(s) {
  if (s.backendSignal && s.backendSignal.category === 'BELI_PAGI') return {label:'PAGI', time:'09:00-10:30', note:'window beli pagi aktif berdasarkan auto scan'};
  if (s.backendSignal && s.backendSignal.category === 'BELI_SORE') return {label:'SORE', time:'14:30-15:50', note:'window beli sore aktif berdasarkan auto scan'};
  var pct = num(s.pctChg);
  var conf = s.trading.conf;
  if (pct <= 1.5 && conf >= 70) return {label:'PAGI', time:'09:00-10:30', note:'entry awal jika harga bertahan di zona entry'};
  if (pct > 1.5 && pct <= 5) return {label:'SORE', time:'14:30-15:50', note:'tunggu konfirmasi menjelang penutupan'};
  return {label:'WAIT', time:'-', note:'jangan kejar harga; tunggu pullback atau flow baru'};
}

function setScanFilter(f){STATE.scanFilter=f;renderScanner();}
function setScanSort(s){STATE.scanSort=s;renderScanner();}
function setScanView(v){STATE.scanView=v;renderScanner();}
function focusScannerSearch(){
  if (STATE.page !== 'scanner') return;
  var input = document.querySelector('.search-input');
  if (input) {
    input.focus();
    try { input.setSelectionRange(input.value.length, input.value.length); } catch(e) {}
  }
}
function setScanSearch(v){
  STATE.scanSearch = v;
  if (STATE.searchTimer) clearTimeout(STATE.searchTimer);
  STATE.searchTimer = setTimeout(function(){
    if (STATE.page !== 'scanner') return;
    renderScanner();
    focusScannerSearch();
    if (String(STATE.scanSearch || '').trim().length >= 2) fetchLive(true);
  }, 420);
}

function renderWatchlist() {
  var enriched=getEnriched();
  var wl=enriched.filter(function(s){return STATE.watchlist.includes(s.symbol);});
  var scored=wl.filter(function(s){return scoreValue(s)>=0;});
  var avgScore=scored.length?scored.reduce(function(a,s){return a+scoreValue(s);},0)/scored.length:null;
  var rest=enriched.filter(function(s){return !STATE.watchlist.includes(s.symbol);});
  document.getElementById('page-watchlist').innerHTML=''
    +'<div style="font-size:18px;font-weight:800;margin-bottom:14px;">Watchlist</div>'
    +'<div class="card card-cyan" style="padding:14px 18px;margin-bottom:14px;">'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;text-align:center;">'
    +[['SAHAM',wl.length,C.cyan],
      ['AVG',scoreText(avgScore),C.yellow],
      ['BUY', wl.filter(function(s){return s.trading.action==='BUY';}).length, C.green],
      ['SELL',wl.filter(function(s){return s.trading.action==='SELL';}).length,C.pink]]
     .map(function(m){return '<div><div class="mono" style="font-size:18px;font-weight:800;color:'+m[2]+';">'+m[1]+'</div><div style="font-size:8px;color:'+C.ter+';margin-top:2px;">'+m[0]+'</div></div>';}).join('')
    +'</div></div>'
    +(wl.length===0?'<div style="text-align:center;padding:40px 0;color:'+C.ter+';"><div style="font-size:18px;opacity:.55;margin-bottom:8px;">WATCH</div><div style="font-size:14px;">Watchlist kosong</div></div>':'')
    +wl.map(function(s){
      return '<div style="position:relative;">'
        +stockCardHTML(s)
        +'<button onclick="toggleWatchlist(\''+s.symbol+'\')" style="position:absolute;top:14px;right:14px;width:24px;height:24px;background:rgba(123,66,188,.15);border:1px solid rgba(123,66,188,.4);border-radius:8px;color:'+C.pink+';font-size:12px;display:flex;align-items:center;justify-content:center;">x</button>'
        +'</div>';
    }).join('')
    +'<div style="margin-top:20px;">'
    +'<div style="font-size:12px;font-weight:700;color:'+C.sec+';margin-bottom:10px;letter-spacing:.04em;">+ TAMBAH SAHAM</div>'
    +rest.slice(0,10).map(function(s){
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:rgba(255,255,255,.03);border-radius:14px;margin-bottom:6px;border:1px solid rgba(255,255,255,.06);">'
        +'<div style="display:flex;align-items:center;gap:9px;">'
        +'<div><span style="font-weight:700;font-size:13px;">'+s.symbol+'</span><div style="font-size:10px;color:'+C.ter+';margin-top:1px;">'+s.name+'</div></div>'
        +actionBadgeHTML(s.trading.action)
        +'</div>'
        +'<div style="display:flex;gap:8px;align-items:center;">'
        +pctHTML(s.pctChg,11)
        +'<button onclick="toggleWatchlist(\''+s.symbol+'\')" style="background:rgba(123,66,188,.12);border:1px solid rgba(123,66,188,.4);border-radius:8px;padding:4px 10px;color:'+C.cyan+';font-size:10px;font-weight:700;">+</button>'
        +'</div></div>';
    }).join('')
    +'</div>';
}
function toggleWatchlist(sym){
  if(STATE.watchlist.includes(sym)) STATE.watchlist=STATE.watchlist.filter(function(s){return s!==sym;});
  else STATE.watchlist.push(sym);
  savePrefs();
  renderWatchlist();
}

    +(STATE.syncErrors.length?'<div style="margin-top:8px;padding:8px 10px;background:rgba(123,66,188,.08);border-radius:10px;font-size:10px;color:'+C.pink+';">'+STATE.syncErrors[0]+'</div>':'')
    +'</div>'

function parseCsv(text) {
  text = String(text || '').replace(/^\uFEFF/, '');
  var rows = [], row = [], cell = '', quoted = false;
  for (var i=0;i<text.length;i++) {
    var ch = text[i], next = text[i+1];
    if (quoted) {
      if (ch === '"' && next === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); if (row.join('').trim()) rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  row.push(cell); if (row.join('').trim()) rows.push(row);
  return rows;
}
function normHeader(h) { return String(h || '').toLowerCase().replace(/[^a-z0-9]/g,''); }
function parseNumCell(v) {
  if (v === null || v === undefined || String(v).trim() === '') return null;
  var n = Number(String(v).replace(/\./g,'').replace(/,/g,'.').replace(/[^\d.-]/g,''));
  return Number.isFinite(n) ? n : null;
}
function normalizeTradeDate(v) {
  var s = String(v || '').trim();
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  var m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if (m) return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  var d = new Date(s);
  return Number.isFinite(d.getTime()) ? d.toISOString().slice(0,10) : null;
}
function headerIndex(headers, aliases) {
  for (var i=0;i<headers.length;i++) if (aliases.includes(headers[i])) return i;
  return -1;
}
async function uploadFlowRows(rows) {
  try {
    var res = await fetch('/api/flow-upload', {
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({rows:rows}),
      signal: AbortSignal.timeout(20000)
    });
    return await res.json();
  } catch(e) {
    return {status:'skipped', error:e && e.message ? e.message : String(e)};
  }
}
function handleUpload(input) {
  var file=input.files[0]; if(!file) return;
  if(!file.name.toLowerCase().endsWith('.csv')){alert('Hanya file .csv yang diterima.');return;}
  var reader=new FileReader();
  reader.onload=async function(e){
    var csv = parseCsv(e.target.result);
    var headers = (csv[0] || []).map(normHeader);
    var idx = {
      symbol: headerIndex(headers, ['symbol','kode','ticker']),
      tradeDate: headerIndex(headers, ['tradedate','date','tanggal']),
      brokerBuy: headerIndex(headers, ['brokerbuy']),
      brokerSell: headerIndex(headers, ['brokersell']),
      foreignBuy: headerIndex(headers, ['foreignbuy']),
      foreignSell: headerIndex(headers, ['foreignsell']),
      netBuy: headerIndex(headers, ['netbuy']),
      freqBuy: headerIndex(headers, ['freqbuy','frequencybuy']),
      freqSell: headerIndex(headers, ['freqsell','frequencysell']),
      volumeAvg5d: headerIndex(headers, ['volumeavg5d','avgvolume5d'])
    };
    var accepted = [], rejected = [];
    for(var i=1;i<csv.length;i++){
      var cols=csv[i];
      var sym=idx.symbol>=0 ? String(cols[idx.symbol]||'-').trim().toUpperCase().replace('.JK','') : '';
      var tradeDate=idx.tradeDate>=0 ? normalizeTradeDate(cols[idx.tradeDate]) : null;
      if(!sym || !SYMBOLS.includes(sym)){ rejected.push('Row '+(i+1)+': unknown symbol'); continue; }
      if(!tradeDate){ rejected.push('Row '+(i+1)+': TradeDate required'); continue; }
      var flow={symbol:sym, tradeDate:tradeDate, source:'local-csv', updatedAt:new Date().toISOString()};
      ['brokerBuy','brokerSell','foreignBuy','foreignSell','netBuy','freqBuy','freqSell','volumeAvg5d'].forEach(function(k){
        if (idx[k] >= 0) {
          var n = parseNumCell(cols[idx[k]]);
          if (n !== null) flow[k]=n;
        }
      });
      STATE.uploadedFlow[sym]=flow;
      accepted.push(flow);
    }
    savePrefs();
    var remote = accepted.length ? await uploadFlowRows(accepted) : {status:'skipped'};
    var log=document.getElementById('uploadLog');
    if(log){
      log.innerHTML='<div class="card" style="padding:14px 16px;margin-bottom:14px;">'
        +'<div style="font-size:11px;font-weight:700;color:'+C.sec+';margin-bottom:8px;">IMPORT LOG</div>'
        +'<div class="mono" style="font-size:10px;color:'+C.cyan+';margin-bottom:3px;">File: '+file.name+'</div>'
        +'<div class="mono" style="font-size:10px;color:'+C.green+';">Rows accepted: '+accepted.length+'</div>'
        +'<div class="mono" style="font-size:10px;color:'+(rejected.length?C.orange:C.green)+';">Rows rejected: '+rejected.length+'</div>'
        +'<div class="mono" style="font-size:10px;color:'+C.sec+';">Saved: localStorage'+(remote.status==='ok'?' + Supabase':'')+'</div>'
        +(remote.error?'<div class="mono" style="font-size:10px;color:'+C.orange+';margin-top:4px;">Remote: '+remote.error+'</div>':'')
        +(rejected.length?'<div style="font-size:10px;color:'+C.ter+';margin-top:6px;">'+rejected.slice(0,4).join('<br>')+'</div>':'')
        +'</div>';
    }
    addLog('CSV import: '+accepted.length+' diterima, '+rejected.length+' ditolak.');
    renderCurrent();
  };
  reader.readAsText(file);
}

function showPage(page){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});

  var target=document.getElementById('page-'+page);
  if(target){target.classList.add('active');target.classList.remove('fade-in');void target.offsetWidth;target.classList.add('fade-in');}
  var navPage=page==='detail'?'scanner':page==='upload'?'settings':page;
  var navBtn=document.getElementById('nav-'+navPage);
  if(navBtn) navBtn.classList.add('active');
  STATE.page=page;
  renderCurrent();
  window.scrollTo(0,0);
}

function renderCurrent(){
  switch(STATE.page){
    case 'dashboard': renderDashboard(); break;
    case 'scanner':   renderScanner();   break;
    case 'signals':   renderSignals();   break;
    case 'detail':    renderDetail();    break;
    case 'watchlist': renderWatchlist(); break;
    case 'settings':  renderSettings();  break;
    case 'upload':    renderUpload();    break;
  }
}
