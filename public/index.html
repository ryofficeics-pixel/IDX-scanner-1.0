function num(v, fb) {
  fb = arguments.length < 2 ? 0 : fb;
  var n = Number(v);
  return Number.isFinite(n) ? n : fb;
}
function maybeNum(v) {
  var n = Number(v);
  return Number.isFinite(n) ? n : null;
}
function safeDiv(a, b, fb) {
  fb = arguments.length < 3 ? 0 : fb;
  a = Number(a); b = Number(b);
  if (!Number.isFinite(a) || !Number.isFinite(b) || b === 0) return fb;
  return a / b;
}
function validPrice(v) {
  var n = Number(v);
  return Number.isFinite(n) && n > 0;
}
function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, num(v, lo)));
}
function hasFlowData(s) {
  return ['brokerBuy','brokerSell','foreignBuy','foreignSell','netBuy','freqBuy','freqSell']
    .some(function(k){ return Number.isFinite(Number(s[k])); });
}
function dataMode(s) {
  var flow = ['brokerBuy','brokerSell','foreignBuy','foreignSell','netBuy','freqBuy','freqSell'];
  var has  = flow.filter(function(k){ return Number.isFinite(Number(s[k])); });
  if (!s || !validPrice(s.price)) return 'NO_DATA';
  if (s.dataMode === 'LOCAL_SAMPLE') return 'LOCAL_SAMPLE';
  if (s.dataMode === 'FLOW_STALE') return 'FLOW_STALE';
  if (s.flowTradeDate && s.flowTradeDate !== todayWIB()) return 'FLOW_STALE';
  if (has.length === flow.length) return 'FULL_FLOW';
  if (has.length > 0)             return 'PARTIAL_FLOW';
  return 'PRICE_ONLY';
}

function todayWIB() {
  return new Date().toLocaleDateString('en-CA', { timeZone:'Asia/Jakarta' });
}

function fmtB(n) {
  if (!Number.isFinite(n)) return 'N/A';
  var a=Math.abs(n), sg=n<0?'-':'';
  if(a>=1e12)return sg+(a/1e12).toFixed(2)+'T';

  if(a>=1e6) return sg+(a/1e6).toFixed(1)+'M';
  if(a>=1e3) return sg+(a/1e3).toFixed(1)+'K';
  return n.toFixed(0);
}
function fmtK(n) {
  if (!Number.isFinite(n)) return 'N/A';
  return n >= 1000 ? (n/1000).toFixed(1)+'K' : String(Math.round(n));
}
function fmtPrice(n) {
  if (!Number.isFinite(Number(n))) return 'N/A';

  // Flow data override (from CSV upload)

  // Page state

// LOCAL CACHE (localStorage)
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
var LS_KEY = 'idx_flow_cache_v2';
var PREF_KEY = 'idx_flow_preferences_v2';
function saveToLocalCache(payload) {
  try { localStorage.setItem(LS_KEY, JSON.stringify({payload:payload,savedAt:Date.now()})); } catch(e){}
}
function loadFromLocalCache() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    var obj = JSON.parse(raw);
    return obj && obj.payload ? obj : null;
  } catch(e) { return null; }
}
function clearLocalCache() {
  try { localStorage.removeItem(LS_KEY); } catch(e){}
}
function savePrefs() {
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify({
      watchlist: STATE.watchlist,
      syncInterval: STATE.syncInterval,
      uploadedFlow: STATE.uploadedFlow
    }));
  } catch(e) {}
}
function loadPrefs() {
  try {
    var raw = localStorage.getItem(PREF_KEY);
    if (!raw) return;
    var p = JSON.parse(raw);
    if (Array.isArray(p.watchlist)) STATE.watchlist = p.watchlist.filter(function(s){ return SYMBOLS.includes(s); });
    if (Number(p.syncInterval) >= 15) STATE.syncInterval = Number(p.syncInterval);
    if (p.uploadedFlow && typeof p.uploadedFlow === 'object') STATE.uploadedFlow = p.uploadedFlow;
  } catch(e) {}
}

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
// PAYLOAD VALIDATION & APPLICATION
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function validatePayload(p) {
  if (!p || typeof p !== 'object') throw new Error('Invalid payload: not an object');
  if (!p.quotes || typeof p.quotes !== 'object') throw new Error('Invalid payload: missing quotes');
  if (Object.keys(p.quotes).length === 0) throw new Error('Payload has 0 quotes');
}

function applyPayload(p) {
  if (!p) return;
  var quotes = p.quotes || {};
  SYMBOLS.forEach(function(sym) {
    var q = quotes[sym];
    if (!q) return;
    if (!validPrice(q.price)) return; // skip invalid
    STATE.liveQuotes[sym] = q;
    // Append to sparkline
    if (SPARKS[sym]) {
      SPARKS[sym] = SPARKS[sym].slice(-19).concat([Math.round(num(q.price))]);
    }
  });
  if (p.IHSG && validPrice(p.IHSG.price)) {
    STATE.liveIHSG = p.IHSG;
  }
  STATE.freshness   = p.freshness  || 'STALE';
  STATE.provider    = p.provider   || p.source || 'â€”';
  STATE.dataSource  = p.source     || 'â€”';
  STATE.lastAsOf    = p.asOf       || null;
  STATE.syncErrors  = Array.isArray(p.errors)   ? p.errors   : [];
  STATE.syncWarnings= Array.isArray(p.warnings) ? p.warnings : [];
  // Log counts
  var count = Object.keys(STATE.liveQuotes).length;
  addLog(count + ' saham diperbarui. Sumber: ' + STATE.provider);
  if (STATE.syncWarnings.length) addLog('Peringatan: ' + STATE.syncWarnings[0]);
}

function getFreshnessAge(asOf) {
  if (!asOf) return null;
  var ms = Date.now() - new Date(asOf).getTime();
  if (ms < 90000)  return 'LIVE';
  if (ms < 900000) return 'RECENT';
  return 'STALE';
}

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
// SYNC ENGINE â€” calls /api/idx-quotes
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function addLog(msg) {
  STATE.syncLog.push({ts:Date.now(), msg:String(msg)});
  if (STATE.syncLog.length > 30) STATE.syncLog.shift();
}

async function fetchLive() {
  if (STATE.fetching) return;
  STATE.fetching = true;
  setSyncUI('fetching');
  addLog('Mengambil data dari backend web syncâ€¦');

  try {
    var res = await fetch('/api/idx-quotes', {
      method: 'GET',
      headers: { 'Accept': 'application/json' },
      signal: AbortSignal.timeout(20000)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var payload = await res.json();
    validatePayload(payload);
    applyPayload(payload);
    saveToLocalCache(payload);
    STATE.lastSync = Date.now();
    var uiState = (payload.freshness === 'LIVE' || payload.freshness === 'LIVE_PRICE') ? 'live'
                : (payload.freshness === 'STALE' || payload.freshness === 'STALE_PRICE') ? 'stale' : 'local';
    setSyncUI(uiState);
    addLog('Sync berhasil. Freshness: ' + payload.freshness);
    renderCurrent();
  } catch(err) {
    var msg = err && err.message ? err.message : String(err);
    addLog('Sync gagal: ' + msg);
    // Try local cache
    var cached = loadFromLocalCache();
    if (cached && cached.payload) {
      addLog('Memakai cache lokal terakhir (STALE).');
      cached.payload.freshness = 'STALE';
      applyPayload(cached.payload);
      STATE.lastSync = cached.savedAt || null;
      setSyncUI('stale');
      renderCurrent();
    } else {
      addLog('Tidak ada cache. Menampilkan data sample lokal.');
      STATE.freshness = 'LOCAL_SAMPLE';
      setSyncUI('local');
      renderCurrent();
    }
  } finally {
    STATE.fetching = false;
  }
}

function forceSync() { fetchLive(); }

function startSyncTimer() {
  if (STATE.syncTimer) clearInterval(STATE.syncTimer);
  if (!STATE.syncInterval || STATE.syncInterval < 15) return;
  STATE.syncTimer = setInterval(fetchLive, STATE.syncInterval * 1000);
}

function setSyncUI(state) {
  STATE.syncState = state;
  var dot   = document.getElementById('syncDot');
  var label = document.getElementById('syncLabel');
  var pill  = document.getElementById('syncPill');
  var tEl   = document.getElementById('syncTime');
  if (!dot) return;
  var map = {
    idle:     {c:'rgba(255,255,255,.38)', l:'STANDBY', bc:'rgba(255,255,255,.2)'},
    fetching: {c:'#FFD600', l:'FETCHING', bc:'rgba(255,214,0,.3)'},
    live:     {c:'#00FF9C', l:'LIVE',     bc:'rgba(0,255,156,.3)'},
    stale:    {c:'#FF8C42', l:'STALE',    bc:'rgba(255,140,66,.3)'},
    local:    {c:'#A78BFA', l:'LOCAL',    bc:'rgba(167,139,250,.3)'},
    error:    {c:'#FF3D7F', l:'ERROR',    bc:'rgba(255,61,127,.3)'},
  };
  var cfg = map[state] || map.idle;
  dot.style.background = cfg.c;
  dot.style.animation  = state === 'fetching' ? 'blink .9s ease-in-out infinite' : 'none';
  dot.style.boxShadow  = state === 'live' ? '0 0 6px #00FF9C' : 'none';
  label.textContent    = cfg.l;
  label.style.color    = cfg.c;
  pill.style.borderColor = cfg.bc;
  if (tEl && STATE.lastSync) tEl.textContent = fmtTime(STATE.lastSync);
}

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
// SIGNAL ENGINE
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function calcNetBuy(s) {
  var nb = maybeNum(s.netBuy);
  if (nb === null) return null;
  return clamp((safeDiv(nb, Math.abs(nb)+1e6) + 1) * 50, 0, 100);
}
function calcForeign(s) {
  var fb = maybeNum(s.foreignBuy), fs = maybeNum(s.foreignSell);
  if (fb === null || fs === null) return null;
  var total = fb + fs;
  return total > 0 ? clamp(safeDiv(fb, total)*100, 0, 100) : 50;
}
function calcBrkDist(s) {
  var bb = maybeNum(s.brokerBuy), bs = maybeNum(s.brokerSell);
  if (bb === null || bs === null || !validPrice(s.price)) return null;
  var avg = (bb+bs)/2;
  if (avg <= 0) return null;
  var d = safeDiv(s.price-avg, avg);
  if (d > .08) return 18;
  if (d < -.08) return 82;
  return clamp(50-d*500, 0, 100);
}
function calcFreq(s) {
  var fb = maybeNum(s.freqBuy), fs = maybeNum(s.freqSell);
  if (fb === null || fs === null) return null;
  var total = fb + fs;
  return total > 0 ? clamp(safeDiv(fb,total)*100, 0, 100) : 50;
}
function calcVolSpike(s) {
  var vol = maybeNum(s.volume), avg5 = maybeNum(s.volumeAvg5d);
  if (vol === null || avg5 === null || avg5 <= 0) return null;
  var r = safeDiv(vol, avg5);
  if (r > 5) return 95; if (r > 3) return 82; if (r > 2) return 68;
  if (r > 1.5) return 58; if (r < .5) return 20;
  return 50;
}
function calcRiskFlags(s) {
  var flags = [];
  var price = num(s.price), prev = num(s.prevClose);
  if (prev > 0 && price > 0) {
    var pChg = safeDiv(price-prev, prev);
    if (pChg > .20) flags.push({label:'Risiko ARA', color:C.pink});
  }
  var bb = maybeNum(s.brokerBuy), bs = maybeNum(s.brokerSell);
  if (bb !== null && bs !== null && price > 0) {
    var bAvg = (bb+bs)/2;
    if (bAvg > 0 && Math.abs(safeDiv(price-bAvg, bAvg)) > .10)
      flags.push({label:'Jauh Broker Avg', color:C.yellow});
  }
  var fb = maybeNum(s.foreignBuy), fs = maybeNum(s.foreignSell);
  if (fb !== null && fs !== null) {
    var fRatio = safeDiv(fs, fb+fs+1);
    if (fRatio > .65) flags.push({label:'Foreign Sell', color:C.yellow});
  }
  var vol = maybeNum(s.volume), avg5 = maybeNum(s.volumeAvg5d);
  if (vol !== null && avg5 !== null && avg5 > 0 && safeDiv(vol,avg5) > 4.5)
    flags.push({label:'Volume Spike Ekstrem', color:C.pink});
  var frqB = maybeNum(s.freqBuy), frqS = maybeNum(s.freqSell);
  if (frqB !== null && frqS !== null && safeDiv(frqB,frqB+frqS+1) < .35)
    flags.push({label:'Frequency Lemah', color:C.ter});
  var nb = maybeNum(s.netBuy);
  if (nb !== null && nb < 0 && fb !== null && fs !== null && safeDiv(fs,fb+fs+1) > .55)
    flags.push({label:'Distribusi Terselubung', color:C.pink});
  return flags;
}

function calcScore(s) {
  var mode = dataMode(s);
  if (mode === 'PRICE_ONLY' || mode === 'LOCAL_SAMPLE' || mode === 'NO_DATA' || mode === 'FLOW_STALE') return null;
  var components = 0, total = 0;
  var nb = calcNetBuy(s);
  if (nb !== null)  { total += nb*0.30;    components += 0.30; }
  var ff = calcForeign(s);
  if (ff !== null)  { total += ff*0.20;    components += 0.20; }
  var bd = calcBrkDist(s);
  if (bd !== null)  { total += bd*0.15;    components += 0.15; }
  var vs = calcVolSpike(s);
  if (vs !== null)  { total += vs*0.15;    components += 0.15; }
  var fq = calcFreq(s);
  if (fq !== null)  { total += fq*0.10;    components += 0.10; }
  if (components <= 0) {
    return null;
  }
  // Normalize to 0-100 based on available components
  var base  = clamp(safeDiv(total, components), 0, 100);
  var penalty = calcRiskFlags(s).length * 12 * 0.10;
  // Reduce confidence if data is incomplete
  var confidenceMult = (mode === 'PRICE_ONLY' || mode === 'LOCAL_SAMPLE') ? 0.65 : (mode === 'PARTIAL_FLOW' ? 0.82 : 1.0);
  return clamp((base - penalty) * confidenceMult, 0, 100);
}

function classifySig(score) {
  if (score === null || score === undefined || !Number.isFinite(Number(score))) {
    return {label:'FLOW N/A', short:'N/A', color:C.ter, bg:'rgba(255,255,255,.07)'};
  }
  score = num(score);
  if (score >= 85) return {label:'AKUMULASI KUAT',short:'AKU+',  color:C.green, bg:'rgba(0,255,156,.13)'};
  if (score >= 70) return {label:'AKUMULASI',     short:'AKU',   color:C.cyan,  bg:'rgba(0,212,255,.11)'};
  if (score >= 55) return {label:'WATCHLIST',     short:'WATCH', color:C.yellow,bg:'rgba(255,214,0,.11)'};
  if (score >= 40) return {label:'HOLD',          short:'HOLD',  color:'rgba(255,255,255,.55)',bg:'rgba(255,255,255,.07)'};
  if (score >= 20) return {label:'DISTRIBUSI',    short:'DIST',  color:C.orange,bg:'rgba(255,140,66,.11)'};
  return               {label:'HINDARI',          short:'HINDARI',color:C.pink, bg:'rgba(255,61,127,.11)'};
}

function calcTrading(s) {
  var rawScore= calcScore(s);
  var score   = rawScore === null ? 0 : num(rawScore);
  var risk    = calcRiskFlags(s);
  var fP      = maybeNum(calcForeign(s));
  var frP     = maybeNum(calcFreq(s));
  var mode    = dataMode(s);
  var hasFull = (mode === 'FULL_FLOW');

  var action, ac, ab, ag;
  // BUY requires full/partial flow data â€” don't signal BUY on price-only
  if (rawScore === null) {
    action='HOLD'; ac=C.yellow; ab='rgba(255,214,0,.12)'; ag=C.yellow;
  } else if (hasFull && score >= 70 && risk.length <= 1 && num(fP,50) >= 50 && num(frP,50) >= 55) {
    action='BUY';  ac=C.green;  ab='rgba(0,255,156,.14)'; ag=C.green;
  } else if (score <= 35 || risk.length >= 3 || (mode!=='PRICE_ONLY' && num(fP,50) < 30 && num(s.netBuy,0) < 0)) {
    action='SELL'; ac=C.pink;   ab='rgba(255,61,127,.14)';ag=C.pink;
  } else {
    action='HOLD'; ac=C.yellow; ab='rgba(255,214,0,.12)'; ag=C.yellow;
  }

  // Confidence â€” reduced for price-only data
  var rawConf = action==='BUY'  ? clamp((score-70)/30*100,0,100)
              : action==='SELL' ? clamp((40-score)/40*100,0,100) : 50;
  var confMult = (mode==='PRICE_ONLY'||mode==='LOCAL_SAMPLE') ? 0.5 : (mode==='PARTIAL_FLOW' ? 0.75 : 1.0);
  var conf = Math.round(clamp(rawConf * confMult, 0, 100));

  // Levels â€” only calculate if price is valid
  var price = num(s.price);
  var bb    = num(s.brokerBuy,  price);
  var bs    = num(s.brokerSell, price);
  var bAvg  = (bb+bs)/2 || price;
  var rnd   = function(v){ return Math.round(num(v)/10)*10; };
  var up    = (score/100)*.08;
  var slP   = risk.length>=2 ? .03 : .05;
  var eL    = validPrice(price) ? rnd(Math.min(price,bAvg)*.995) : null;
  var eH    = validPrice(price) ? rnd(Math.max(price,bAvg)*1.005) : null;
  var t1    = validPrice(price) ? rnd(price*(1+up*.5)) : null;
  var t2    = validPrice(price) ? rnd(price*(1+up))    : null;
  var sl    = validPrice(price) ? rnd(Math.min(price*(1-slP), bs*.98)) : null;
  var rr    = (t2&&sl&&t2>price&&sl<price) ? safeDiv(t2-price,price-sl).toFixed(1) : 'â€”';

  var slabel = conf>=80?'SANGAT KUAT':conf>=60?'KUAT':conf>=40?'SEDANG':'LEMAH';
  var scolor = conf>=80?C.green:conf>=60?C.cyan:conf>=40?C.yellow:C.orange;

  var reasons = [];
  var nb = maybeNum(s.netBuy);
  if (nb !== null && nb > 0) reasons.push({t:'Net buy '+fmtB(nb), p:true});
  if (nb !== null && nb < 0) reasons.push({t:'Net sell '+fmtB(nb), p:false});
  if (fP !== null && fP > 55) reasons.push({t:'Foreign buy '+fP.toFixed(0)+'%', p:true});
  if (fP !== null && fP < 45) reasons.push({t:'Foreign sell dominan', p:false});
  if (frP !== null && frP > 60) reasons.push({t:'Freq buy dominan '+frP.toFixed(0)+'%', p:true});
  var vs = calcVolSpike(s);
  if (vs !== null && vs > 65) reasons.push({t:'Volume spike aktif', p:true});
  if (mode === 'PRICE_ONLY')    reasons.push({t:'Data flow tidak tersedia â€” confidence terbatas', p:false});
  if (mode === 'LOCAL_SAMPLE')  reasons.push({t:'Data sample lokal â€” bukan harga real', p:false});
  risk.forEach(function(f){ reasons.push({t:f.label, p:false}); });

  return {action,ac,ab,ag,conf,slabel,scolor,eL,eH,t1,t2,sl,rr,reasons};
}

function enrich(sym, liveQ) {
  var flow = STATE.uploadedFlow[sym] || {};
  var meta = STOCK_META[sym] || {name:sym, sector:'â€”'};
  // Merge: live price overrides base; flow data from upload
  var s = {
    symbol:    sym,
    name:      meta.name,
    sector:    meta.sector,
    // Price fields from live (or null)
    price:     liveQ && validPrice(liveQ.price)     ? num(liveQ.price)     : null,
    prevClose: liveQ && validPrice(liveQ.prevClose) ? num(liveQ.prevClose) : null,
    high:      liveQ ? maybeNum(liveQ.high)   : null,
    low:       liveQ ? maybeNum(liveQ.low)    : null,
    volume:    liveQ ? maybeNum(liveQ.volume) : null,
    pctChg:    liveQ ? num(liveQ.pctChg)      : 0,
    // Flow fields â€” from upload only (not faked)
    brokerBuy:   liveQ && liveQ.brokerBuy   != null ? maybeNum(liveQ.brokerBuy)   : maybeNum(flow.brokerBuy),
    brokerSell:  liveQ && liveQ.brokerSell  != null ? maybeNum(liveQ.brokerSell)  : maybeNum(flow.brokerSell),
    foreignBuy:  liveQ && liveQ.foreignBuy  != null ? maybeNum(liveQ.foreignBuy)  : maybeNum(flow.foreignBuy),
    foreignSell: liveQ && liveQ.foreignSell != null ? maybeNum(liveQ.foreignSell) : maybeNum(flow.foreignSell),
    netBuy:      liveQ && liveQ.netBuy      != null ? maybeNum(liveQ.netBuy)      : maybeNum(flow.netBuy),
    freqBuy:     liveQ && liveQ.freqBuy     != null ? maybeNum(liveQ.freqBuy)     : maybeNum(flow.freqBuy),
    freqSell:    liveQ && liveQ.freqSell    != null ? maybeNum(liveQ.freqSell)    : maybeNum(flow.freqSell),
    volumeAvg5d: maybeNum(flow.volumeAvg5d),
    flowTradeDate: flow.tradeDate || null,
    flowSource: flow.source || (flow.tradeDate ? 'local-csv' : null),
    flowUpdatedAt: flow.updatedAt || null,
    // Source metadata
    dataMode: liveQ ? (liveQ.dataMode||'PRICE_ONLY') : 'NO_DATA',
    asOf:     liveQ ? (liveQ.asOf||null) : null,
    source:   liveQ ? (liveQ.source||'â€”') : 'base-data',
  };
  // Override dataMode based on actual available fields
  s.dataMode = dataMode(s);

  var score     = calcScore(s);
  var signal    = classifySig(score);
  var brokerAvg = (num(s.brokerBuy)+num(s.brokerSell))/2 || num(s.price);
  return Object.assign(s, {
    score,
    signal,
    brokerAvg,
    pbDist:     validPrice(brokerAvg) ? safeDiv(num(s.price)-brokerAvg, brokerAvg)*100 : 0,
    foreignNet: num(s.foreignBuy) - num(s.foreignSell),
    foreignPct: (function(){ var f=calcForeign(s); return f!==null?f-50:null; })(),
    riskFlags:  calcRiskFlags(s),
    volRatio:   (function(){ var a=maybeNum(s.volumeAvg5d); return a&&a>0?safeDiv(s.volume,a):null; })(),
    freqRatio:  (function(){ var b=maybeNum(s.freqBuy),c=maybeNum(s.freqSell); return b!==null&&c!==null?safeDiv(b,b+c)*100:null; })(),
    trading:    calcTrading(s),
  });
}

function getEnriched() {
  return SYMBOLS.map(function(sym){ return enrich(sym, STATE.liveQuotes[sym]||null); });
}

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
// SVG & HTML HELPERS
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function sparkSVG(data, w, h, color, filled) {
  if (!data||data.length<2) return '';
  var min=Math.min.apply(null,data),max=Math.max.apply(null,data),rng=max-min||1;
  var pts=data.map(function(v,i){return (i/(data.length-1))*w+','+(h-2-((v-min)/rng)*(h-6));}).join(' ');
  var id='sp'+w+h+(color||'').replace(/\W/g,'');
  var poly=filled?'<polygon points="0,'+h+' '+pts+' '+w+','+h+'" fill="url(#'+id+')"/>':'';
  return '<svg width="'+w+'" height="'+h+'" style="display:block;overflow:visible"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".35"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+poly+'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function ringHTML(pct, color, size, stroke, label) {
  if (pct === null || pct === undefined || !Number.isFinite(Number(pct))) {
    size=size||52; stroke=stroke||6;
    var cx0=size/2, cy0=size/2, r0=size/2-stroke/2;
    return '<svg width="'+size+'" height="'+size+'"><circle cx="'+cx0+'" cy="'+cy0+'" r="'+r0+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="'+stroke+'"/><text x="'+cx0+'" y="'+(cy0+4)+'" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="10" font-weight="700" font-family="DM Mono,monospace">N/A</text>'+(label?'<text x="'+cx0+'" y="'+(cy0+14)+'" text-anchor="middle" fill="rgba(255,255,255,.38)" font-size="8" font-family="DM Sans,sans-serif">'+label+'</text>':'')+'</svg>';
  }
  pct=clamp(num(pct),0,100); size=size||52; stroke=stroke||6;
  var r=size/2-stroke/2, circ=2*Math.PI*r, off=circ*(1-pct/100);
  var cx=size/2, cy=size/2;
  return '<svg width="'+size+'" height="'+size+'"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="'+stroke+'"/><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'" stroke-linecap="round" transform="rotate(-90 '+cx+' '+cy+')" style="transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)"/><text x="'+cx+'" y="'+(cy+(label?2:4))+'" text-anchor="middle" fill="'+color+'" font-size="'+(label?10:12)+'" font-weight="700" font-family="DM Mono,monospace">'+Math.round(pct)+'</text>'+(label?'<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" fill="rgba(255,255,255,.38)" font-size="8" font-family="DM Sans,sans-serif">'+label+'</text>':'')+'</svg>';
}
function scoreBarHTML(score, height) {
  if (score === null || score === undefined || !Number.isFinite(Number(score))) {
    height=height||4;
    return '<div style="display:flex;align-items:center;gap:6px;"><div class="score-track" style="flex:1;height:'+height+'px;"><div class="score-fill" style="width:0%;background:rgba(255,255,255,.16);"></div></div><span class="mono" style="font-size:10px;color:'+C.ter+';min-width:28px;">N/A</span></div>';
  }
  height=height||4; score=clamp(num(score),0,100);
  var sig=classifySig(score);
  return '<div style="display:flex;align-items:center;gap:6px;"><div class="score-track" style="flex:1;height:'+height+'px;"><div class="score-fill" style="width:'+score.toFixed(0)+'%;background:linear-gradient(90deg,'+sig.color+'70,'+sig.color+');box-shadow:0 0 8px '+sig.color+'60;"></div></div><span class="mono" style="font-size:10px;color:'+C.sec+';min-width:22px;">'+score.toFixed(0)+'</span></div>';
}
function scoreValue(s) {
  return s && Number.isFinite(Number(s.score)) ? Number(s.score) : -1;
}
function scoreText(score, dec) {
  if (score === null || score === undefined || !Number.isFinite(Number(score))) return 'N/A';
  return Number(score).toFixed(dec == null ? 0 : dec);
}
function badgeHTML(label, color, bg, size, dot) {
  size=size||10;
  return '<span class="badge" style="background:'+(bg||'rgba(255,255,255,.08)')+';color:'+color+';border:1px solid '+color+'38;padding:2px '+(size<=10?6:8)+'px;font-size:'+size+'px;">'+(dot?'<span class="bdot" style="background:'+color+';"></span>':'')+'<span>'+label+'</span></span>';
}
function actionBadgeHTML(action) {
  var cls=action==='BUY'?'act-buy':action==='SELL'?'act-sell':'act-hold';
  return '<span class="'+cls+'" style="border-radius:999px;padding:2px 9px;font-size:10px;font-weight:900;letter-spacing:.07em;">'+action+'</span>';
}
function pctHTML(v, size) {
  size=size||12; var n=num(v), col=n>=0?C.green:C.pink;
  return '<span class="mono" style="font-size:'+size+'px;font-weight:700;color:'+col+';">'+(n>=0?'+':'')+n.toFixed(2)+'%</span>';
}
function dataModeBadge(mode) {
  var map={
    FULL_FLOW:    {l:'FULL FLOW',    c:C.green,  bg:'rgba(0,255,156,.12)'},
    PARTIAL_FLOW: {l:'PARTIAL FLOW', c:C.cyan,   bg:'rgba(0,212,255,.12)'},
    PRICE_ONLY:   {l:'PRICE ONLY',  c:C.yellow, bg:'rgba(255,214,0,.12)'},
    FLOW_STALE:   {l:'FLOW STALE',  c:C.orange, bg:'rgba(255,140,66,.12)'},
    NO_DATA:      {l:'NO DATA',     c:C.pink,   bg:'rgba(255,61,127,.12)'},
    LOCAL_SAMPLE: {l:'SAMPLE DATA', c:C.orange, bg:'rgba(255,140,66,.12)'},
  };
  var m=map[mode]||map.PRICE_ONLY;
  return badgeHTML(m.l, m.c, m.bg, 9);
}
function freshnessColor(f) {
  if(f==='LIVE' || f==='LIVE_PRICE')   return C.green;
  if(f==='STALE' || f==='STALE_PRICE') return C.orange;
  if(f==='LOCAL_SAMPLE') return C.purple;
  return C.ter;
}

function parseCsv(text) {
  text = String(text || '').replace(/^\uFEFF/, '');
  var rows = [], row = [], cell = '', quoted = false;
  for (var i=0;i<text.length;i++) {
    var ch = text[i], next = text[i+1];
    if (quoted) {
      if (ch === '"' && next === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); if (row.join('').trim()) rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  row.push(cell); if (row.join('').trim()) rows.push(row);
  return rows;
}
function normHeader(h) { return String(h || '').toLowerCase().replace(/[^a-z0-9]/g,''); }
function parseNumCell(v) {
  if (v === null || v === undefined || String(v).trim() === '') return null;
  var n = Number(String(v).replace(/\./g,'').replace(/,/g,'.').replace(/[^\d.-]/g,''));
  return Number.isFinite(n) ? n : null;
}
function normalizeTradeDate(v) {
  var s = String(v || '').trim();
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  var m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if (m) return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  var d = new Date(s);
  return Number.isFinite(d.getTime()) ? d.toISOString().slice(0,10) : null;
}
function headerIndex(headers, aliases) {
  for (var i=0;i<headers.length;i++) if (aliases.includes(headers[i])) return i;
  return -1;
}
async function uploadFlowRows(rows) {
  try {
    var res = await fetch('/api/flow-upload', {
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({rows:rows}),
      signal: AbortSignal.timeout(20000)
    });
    return await res.json();
  } catch(e) {
    return {status:'skipped', error:e && e.message ? e.message : String(e)};
  }
}
function handleUpload(input) {
  var file=input.files[0]; if(!file) return;
  if(!file.name.toLowerCase().endsWith('.csv')){alert('Hanya file .csv yang diterima.');return;}
  var reader=new FileReader();
  reader.onload=async function(e){
    var csv = parseCsv(e.target.result);
    var headers = (csv[0] || []).map(normHeader);
    var idx = {
      symbol: headerIndex(headers, ['symbol','kode','ticker']),
      tradeDate: headerIndex(headers, ['tradedate','date','tanggal']),
      brokerBuy: headerIndex(headers, ['brokerbuy']),
      brokerSell: headerIndex(headers, ['brokersell']),
      foreignBuy: headerIndex(headers, ['foreignbuy']),
      foreignSell: headerIndex(headers, ['foreignsell']),
      netBuy: headerIndex(headers, ['netbuy']),
      freqBuy: headerIndex(headers, ['freqbuy','frequencybuy']),
      freqSell: headerIndex(headers, ['freqsell','frequencysell']),
      volumeAvg5d: headerIndex(headers, ['volumeavg5d','avgvolume5d'])
    };
    var accepted = [], rejected = [];
    for(var i=1;i<csv.length;i++){
      var cols=csv[i];
      var sym=idx.symbol>=0 ? String(cols[idx.symbol]||'').trim().toUpperCase().replace('.JK','') : '';
      var tradeDate=idx.tradeDate>=0 ? normalizeTradeDate(cols[idx.tradeDate]) : null;
      if(!sym || !SYMBOLS.includes(sym)){ rejected.push('Row '+(i+1)+': unknown symbol'); continue; }
      if(!tradeDate){ rejected.push('Row '+(i+1)+': TradeDate required'); continue; }
      var flow={symbol:sym, tradeDate:tradeDate, source:'local-csv', updatedAt:new Date().toISOString()};
      ['brokerBuy','brokerSell','foreignBuy','foreignSell','netBuy','freqBuy','freqSell','volumeAvg5d'].forEach(function(k){
        if (idx[k] >= 0) {
          var n = parseNumCell(cols[idx[k]]);
          if (n !== null) flow[k]=n;
        }
      });
      STATE.uploadedFlow[sym]=flow;
      accepted.push(flow);
    }
    savePrefs();
    var remote = accepted.length ? await uploadFlowRows(accepted) : {status:'skipped'};
    var log=document.getElementById('uploadLog');
    if(log){
      log.innerHTML='<div class="card" style="padding:14px 16px;margin-bottom:14px;">'
        +'<div style="font-size:11px;font-weight:700;color:'+C.sec+';margin-bottom:8px;">IMPORT LOG</div>'
        +'<div class="mono" style="font-size:10px;color:'+C.cyan+';margin-bottom:3px;">File: '+file.name+'</div>'
        +'<div class="mono" style="font-size:10px;color:'+C.green+';">Rows accepted: '+accepted.length+'</div>'
        +'<div class="mono" style="font-size:10px;color:'+(rejected.length?C.orange:C.green)+';">Rows rejected: '+rejected.length+'</div>'
        +'<div class="mono" style="font-size:10px;color:'+C.sec+';">Saved: localStorage'+(remote.status==='ok'?' + Supabase':'')+'</div>'
        +(remote.error?'<div class="mono" style="font-size:10px;color:'+C.orange+';margin-top:4px;">Remote: '+remote.error+'</div>':'')
        +(rejected.length?'<div style="font-size:10px;color:'+C.ter+';margin-top:6px;">'+rejected.slice(0,4).join('<br>')+'</div>':'')
        +'</div>';
    }
    addLog('CSV import: '+accepted.length+' diterima, '+rejected.length+' ditolak.');
    renderCurrent();
  };
  reader.readAsText(file);
}
function openDetail(sym){STATE.selectedSym=sym;STATE.detailTab='signal';showPage('detail');}

function showPage(page){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  var target=document.getElementById('page-'+page);
  if(target){target.classList.add('active');target.classList.remove('fade-in');void target.offsetWidth;target.classList.add('fade-in');}
  var navPage=page==='detail'?'scanner':page==='upload'?'settings':page;
  var navBtn=document.getElementById('nav-'+navPage);
  if(navBtn) navBtn.classList.add('active');
  STATE.page=page;
  renderCurrent();
  window.scrollTo(0,0);
}

function renderCurrent(){
  switch(STATE.page){
    case 'dashboard': renderDashboard(); break;
    case 'scanner':   renderScanner();   break;
    case 'signals':   renderSignals();   break;
    case 'detail':    renderDetail();    break;
    case 'watchlist': renderWatchlist(); break;
    case 'settings':  renderSettings();  break;
    case 'upload':    renderUpload();    break;
  }
}
