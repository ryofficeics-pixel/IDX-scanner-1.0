services:
  gateway:
    build: .
    hostname: idx-stockbit-gateway
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STOCKBIT_TRADING: "off"
      STOCKBIT_NO_BROWSER: "1"
      STOCKBIT_TOOLS: core
      STOCKBIT_FORCE_FILE_STORE: "1"
      STOCKBIT_STORE_DIR: /data/stockbit
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - stockbit_state:/data/stockbit
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  stockbit_state:
